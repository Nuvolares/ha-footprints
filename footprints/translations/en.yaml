configuration:
  entities:
    name: People and trackers (typed by hand; use the app's Settings instead)
    description: >-
      Easier: open Footprints and select the gear at the top of the panel.
      It lists every person and GPS tracker in Home Assistant to tick, and
      replaces this field once saved. This tab can only take typed text:
      entity IDs such as person.alex. Empty records every person.
  users:
    name: Who can open Footprints (typed by hand; use the app's Settings instead)
    description: >-
      Easier: open Footprints and select the gear at the top of the panel.
      It lists every Home Assistant user to pick from, and replaces this
      field once saved. This tab can only take typed text: usernames (login
      names) with the people each may see. Empty lets every administrator
      in.
  min_distance_m:
    name: Minimum movement (m)
    description: >-
      Location updates closer than this to the last stored point are skipped,
      unless 15 minutes have passed. Keeps the database small while standing
      still.
  max_accuracy_m:
    name: Ignore inaccurate fixes (m)
    description: >-
      Location updates with a GPS accuracy worse than this are ignored.
  import_days:
    name: History import limit (days)
    description: >-
      How far back to import from the Home Assistant recorder. The recorder
      only keeps 10 days by default; Footprints keeps everything from then on.
  keep_days:
    name: Keep history (days)
    description: Delete points older than this. 0 keeps everything forever.
  cell_size_m:
    name: Default spot size (m)
    description: >-
      Locations within this grid size count as the same place. Can be changed
      on the map.
  map_style:
    name: Light or dark map
    description: >-
      auto follows your device's light or dark mode. Dark mode darkens the
      Home Assistant and OpenStreetMap maps. osm is the same as light. The
      map type itself is picked on the map.
  tile_url:
    name: Custom tile URL
    description: >-
      Optional. A tile server URL such as https://tile.example.com/{z}/{x}/{y}.png.
      Adds a "Custom" choice to the map types.
  snap_to_roads:
    name: Snap routes to streets
    description: >-
      Draw routes along the actual streets and paths instead of straight
      lines, routed from each recorded point to the next like a navigation
      system. This sends each trip's coordinates (no times, no names) once to
      the routing server below.
  routing_url:
    name: Routing server
    description: >-
      OSRM server used to snap routes to streets. {profile} is replaced with
      car, bike or foot. The default is the free FOSSGIS server; point it at
      your own OSRM server to keep everything at home.
  log_level:
    name: Log level
    description: How much detail the app writes to its log.
